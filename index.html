<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="EncontraAi — encontre e compare postos de combustível perto de você.">
    <title>PI | EncontraAi — Postos próximos</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="./style/postos.css">
</head>
<body>
    <header class="topo">
        <a class="logo" href="./" aria-label="EncontraAi Início">
            <img src="./img/logo/logo_svg.svg" alt="EncontraAi">
        </a>

        <nav class="menu" aria-label="Navegação principal">
            <a href="#" class="ativo" id="navPostos">Postos</a>
            <a href="./pages/sobre.html" id="navSobre">Sobre</a>
            <a href="./pages/dicas.html" id="navDicas">Dicas</a>
        </nav>

        <button class="avatar" type="button" aria-label="Informações de perfil" data-info="perfil">
            <img src="./img/user_Default.png" alt="">
        </button>
    </header>

    <div class="app" id="app">

        <aside class="sidebar" id="filtros" aria-label="Filtros de busca">
            
            <!-- 1. TOPO: Buscar Endereço -->
            <section class="grupo grupo-topo-fixo">
                <h2>
                    <span class="search-icon" aria-hidden="true">
                        <img src="./img/icones/lupa.svg" alt="">
                    </span>
                    Buscar endereço
                </h2>

                <div class="localizacao-manual">
                    <input id="endereco" aria-label="Seu endereço" placeholder="Franca Av. Chico Júlio" autocomplete="street-address">
                    <div id="sugestoes" class="sugestoes-box"></div>
                </div>

                <p class="ou">ou</p>

                <button id="btnLocalizacao" class="btn-gps" type="button">
                    <img src="./img/gps.svg" alt="" aria-hidden="true">
                    Usar minha localização
                </button>
            </section>

            <hr>

            <!-- 2. MIOLO ROLÁVEL (Área que encolhe/rola se a tela for pequena) -->
            <div class="sidebar-scroll">


                <section class="grupo">
                    <h2>
                        <span class="location-icon" aria-hidden="true">
                            <img src="./img/icones/pin_verde.svg" alt="">
                        </span>
                        Raio de busca
                    </h2>

                    <div class="raio-wrapper">
                        <input type="range" id="selRaio" min="1" max="15" value="5" aria-label="Raio de busca em quilômetros">
                        <output id="balao-raio" for="selRaio">5 km</output>
                    </div>
                </section>

                <hr>

                <section class="grupo fuel-group">
                    <h2>
                        <span class="gas-icon" aria-hidden="true">
                            <img src="./img/icones/bomba_verde.svg" alt="">
                        </span>
                        Combustível
                    </h2>

                    <label class="fuel">
                        <span><i class="drop"><img src="./img/icones/gasolina.svg" alt=""></i>Gasolina Comum</span>
                        <input type="checkbox" data-fuel="gasolina">
                    </label>

                    <label class="fuel">
                        <span><i class="drop"><img src="./img/icones/gasolina.svg" alt=""></i>Gasolina Aditivada</span>
                        <input type="checkbox" data-fuel="gasolina-aditivada">
                    </label>

                    <label class="fuel">
                        <span><i class="drop"><img src="./img/icones/etanol.svg" alt=""></i>Etanol</span>
                        <input type="checkbox" data-fuel="etanol">
                    </label>

                    <label class="fuel">
                        <span><i class="drop"><img src="./img/icones/diesel.svg" alt=""></i>Diesel S10</span>
                        <input type="checkbox" data-fuel="diesel-s10">
                    </label>

                    <label class="fuel">
                        <span><i class="drop"><img src="./img/icones/diesel.svg" alt=""></i>Diesel S500</span>
                        <input type="checkbox" data-fuel="diesel-s500">
                    </label>

                    <p id="avisoMapa" class="aviso-mapa" role="status">
                        Para ver preços no mapa, marque apenas um combustível.
                    </p>

                    <hr>
                </section>

                <section class="grupo bandeira-group">
                    <h2>
                        <span class="bandeira-icon" aria-hidden="true">
                        <img src="./img/icones/bandeira.svg" alt="">
                        </span>
                    Bandeira
                    </h2>

                    <div class="advanced">

                        <select id="selBandeira" aria-labelledby="rotuloBandeira" hidden>
                            <option value="">Todas as bandeiras</option>
                        </select>

                        <details id="menuBandeiras" class="menu-bandeiras">
                            <summary id="bandeiraEscolhida">Todas as bandeiras</summary>
                            <div id="listaBandeiras"></div>
                        </details>

                        <label>
                            <input id="chkApenasANP" type="checkbox">
                            Apenas com preços da ANP
                        </label>

                    </div>
                </section>
                
            </div>

            <hr>

            <!-- 3. BOTÃO BUSCAR FIXO FORA DO SCROLL, LOGO ABAIXO DA DIV -->
            <div class="sidebar-footer-fixo">
                <button class="buscar" id="btnEndereco" type="button">
                    <span aria-hidden="true">
                        <img src="./img/icones/lupa_branca.svg" alt="">
                    </span>
                    Buscar
                </button>
            </div>
        </aside>

        <main class="conteudo">
            <div class="map-region">
                <div id="map" aria-label="Mapa dos postos próximos"></div>

                <button id="toggleFiltros" class="toggle-filtros" aria-label="Recolher filtros" aria-controls="filtros" aria-expanded="true">
                    <img src="./img/icones/recolher.svg" alt="">
                </button>
            </div>

            <section class="lista-container" aria-label="Postos encontrados">
                <div class="ordenacao-resultados">
                    <label>
                        Ordenar por
                        <select id="selOrdenacao">
                            <option value="distancia">Mais próximos</option>
                            <option value="preco">Mais baratos</option>
                        </select>
                    </label>
                </div>

                <div id="postos"></div>
                <p id="status" role="status"></p>
            </section>
        </main>
    </div>

    <dialog id="welcome" class="welcome">
        <form id="welcomeForm">
            <img src="./img/logo/logo_svg.svg" alt="EncontraAi">

            <h1>Digite seu endereço</h1>

            <div class="localizacao-manual">
                <input id="welcomeEndereco" aria-label="Seu endereço" placeholder="Franca Av. Chico Júlio" autocomplete="street-address">
                <div id="sugestoesEndereco" class="sugestoes-box"></div>
            </div>

            <p class="ou">ou</p>

            <button id="welcomeGps" class="btn-gps" type="button">
                <img src="./img/gps.svg" alt="" aria-hidden="true">
                Usar minha localização
            </button>

            <div class="welcome-radius">
                <span class="location-icon" aria-hidden="true">
                    <img src="./img/icones/pin_verde.svg" alt="">
                </span>
                <input type="range" id="welcomeRaio" min="1" max="15" value="5" aria-label="Raio em quilômetros">
                <output id="welcomeOutput" for="welcomeRaio">5km</output>
            </div>

            <div class="welcome-select">
                <img class="pump-icon" src="./img/icones/bomba_cinza.svg" alt="">

                <select id="welcomeCombustivel" aria-label="Selecione o combustível">
                    <option value="">Selecione o combustível</option>
                    <option value="gasolina">Gasolina</option>
                    <option value="etanol">Etanol</option>
                    <option value="diesel-s10">Diesel</option>
                </select>

                <span class="select-arrow" aria-hidden="true">
                    <img src="./img/icones/seta_ordenar.svg" alt="">
                </span>
            </div>

            <button class="buscar" type="submit">
                <span aria-hidden="true">
                    <img src="./img/icones/lupa_branca.svg" alt="">
                </span>
                Buscar
            </button>

            <p id="welcomeError" role="status"></p>
        </form>
    </dialog>

    <dialog id="infoDialog" class="info-dialog">
        <button id="closeInfo" aria-label="Fechar" class="close-info">
            <img src="./img/icones/estender.svg" alt="">
        </button>

        <h2 id="infoTitle"></h2>

        <p id="infoText"></p>
    </dialog>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="./scripts/App.js"></script>
</body>
</html>
